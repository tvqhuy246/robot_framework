name: Robot Framework CI

on:
  push:
    branches: [ "qhuy" ]
  pull_request:

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t robot-test .

      - name: Run Robot Framework test
        run: docker run robot-test
